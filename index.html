<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelArtist</title>
<link rel="icon" href="data:,">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top-bar">
  <div id="menu-bar">
    <button id="btn-new">New</button>
    <button id="btn-open">Open</button>
    <button id="btn-save">Save</button>
    <button id="btn-save-as">Save As…</button>
    <button id="btn-export">Export</button>
  </div>
  <nav id="mode-tabs">
    <button id="tab-sprites" class="active">Sprite Sheets</button>
    <button id="tab-tiles">Tile Sheets</button>
  </nav>
  <select id="sheet-select"></select>
  <button id="btn-new-sheet" title="New sheet">+</button>
  <div id="overlay-toggles">
    <label><input type="checkbox" id="ovl-labels" checked> Labels</label>
    <label><input type="checkbox" id="ovl-seq" checked> Sequences</label>
  </div>
  <div id="history-buttons">
    <button id="btn-undo" disabled>↶</button>
    <button id="btn-redo" disabled>↷</button>
  </div>
</header>
<main id="workspace">
  <aside id="tool-palette"></aside>
  <section id="canvas-host"></section>
  <aside id="side-panels">
    <div id="panel-colors" class="panel"><h3>Colors</h3></div>
    <div id="panel-layers" class="panel"><h3>Layers</h3></div>
    <div id="panel-context" class="panel"></div>
  </aside>
</main>
<div id="timeline-dock"></div>
<footer id="status-bar"><span id="status-pos"></span><span id="status-zoom"></span><span id="status-tool"></span></footer>
<dialog id="dlg-open">
  <h3>Open</h3>
  <div class="row">
    <button id="open-packed">Packed file (.pixelproj)</button>
    <button id="open-unpacked">Folder…</button>
  </div>
  <div class="row"><button id="open-cancel">Cancel</button></div>
</dialog>
<dialog id="dlg-saveas">
  <h3>Save As</h3>
  <div class="row">
    <button id="saveas-packed">Packed file (.pixelproj)</button>
    <button id="saveas-unpacked">Unpacked folder</button>
  </div>
  <div class="row"><button id="saveas-cancel">Cancel</button></div>
</dialog>
<dialog id="dlg-export">
  <h3>Export</h3>
  <div class="row">
    <button id="export-png">Sheet PNG (flattened)</button>
    <button id="export-frames" disabled>Frames JSON</button>
    <button id="export-tiles" disabled>Tiles JSON</button>
  </div>
  <div class="row"><button id="export-cancel">Cancel</button></div>
</dialog>
<dialog id="dlg-newproject">
  <h3>New Project</h3>
  <div class="dlg-grid">
    <span>Sprite sheet</span><input id="np-sprite-w" type="number" min="1" max="4096" value="256">
    <span>×</span><input id="np-sprite-h" type="number" min="1" max="4096" value="256">
    <span>Tile sheet</span><input id="np-tile-sheet-w" type="number" min="1" max="4096" value="256">
    <span>×</span><input id="np-tile-sheet-h" type="number" min="1" max="4096" value="256">
    <span>Tile size</span><input id="np-tile-w" type="number" min="1" max="256" value="16">
    <span>×</span><input id="np-tile-h" type="number" min="1" max="256" value="16">
    <span>Frame size</span><input id="np-frame-w" type="number" min="1" max="1024" value="16">
    <span>×</span><input id="np-frame-h" type="number" min="1" max="1024" value="16">
    <span>Frame time</span><input id="np-duration" type="number" min="1" value="100">
    <span>ms</span><span></span>
  </div>
  <div class="row"><button id="np-create">Create</button><button id="np-cancel">Cancel</button></div>
</dialog>
<dialog id="dlg-newsheet">
  <h3>New Sheet</h3>
  <div class="dlg-grid">
    <span>Name</span><input id="ns-name" type="text" style="grid-column: 2 / span 3">
    <span>Size</span><input id="ns-w" type="number" min="1" max="4096" value="256">
    <span>×</span><input id="ns-h" type="number" min="1" max="4096" value="256">
    <span class="ns-tile-row">Tile size</span><input id="ns-tile-w" class="ns-tile-row" type="number" min="1" max="256" value="16">
    <span class="ns-tile-row">×</span><input id="ns-tile-h" class="ns-tile-row" type="number" min="1" max="256" value="16">
  </div>
  <div class="row"><button id="ns-create">Create</button><button id="ns-cancel">Cancel</button></div>
</dialog>
<dialog id="dlg-newstrip">
  <h3>New Animation Strip</h3>
  <div class="dlg-grid">
    <span>Name</span><input id="strip-name" type="text" style="grid-column: 2 / span 3">
    <span>Frame size</span><input id="strip-frame-w" type="number" min="1" max="1024" value="16">
    <span>×</span><input id="strip-frame-h" type="number" min="1" max="1024" value="16">
    <span>Count</span><input id="strip-count" type="number" min="1" value="4">
    <span>Duration</span><input id="strip-duration" type="number" min="1" value="100">
    <span>ms</span><span></span>
  </div>
  <div class="row"><button id="strip-create">Create</button><button id="strip-cancel">Cancel</button></div>
</dialog>
<script type="module" src="js/app/main.js"></script>
</body>
</html>
